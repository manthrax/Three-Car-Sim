<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vite-project</title>
  <!-- Ammo.js Physics Engine -->
  <script src="https://rawcdn.githack.com/kripken/ammo.js/8f8b7187ef74994093318645e5e96b11d982688a/builds/ammo.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.183.2/build/three.module.js",
        "three/examples/jsm/": "https://unpkg.com/three@0.183.2/examples/jsm/"
      }
    }
  </script>
  <link rel="stylesheet" href="./src/style.css">
</head>

<body>
  <div id="app"></div>
  <div id="ui-overlay">
    <div class="card glass">
      <h1>Car Sim</h1>
      <p>WASD to Drive | Shift to Boost | C to Toggle Camera</p>
      <div class="stats">
        <div class="stat-item">
          <span class="label">Speed</span>
          <span id="speed-val" class="value">0</span>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>

</html>
